{{ with site.Params.comments.commentbox }}
  {{ if and .enabled .projectId }}
    <section class="comments-section" aria-label="Comments">
      <div class="comments-loading" role="status">
        <p id="comments-status">Loading comments…</p>
        <button type="button" id="comments-retry" hidden>Retry loading comments</button>
      </div>
      <noscript><p>Please enable JavaScript to load comments.</p></noscript>
      <div
        id="commentbox"
        class="commentbox"
        data-project-id="{{ .projectId }}"
        hidden></div>
      {{ $comments := resources.Get "js/comments.js" | minify | fingerprint }}
      <script src="{{ $comments.RelPermalink }}" defer></script>
    </section>
  {{ end }}
{{ end }}
